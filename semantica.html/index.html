<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantica</title>
</head>
<body>  
    
    <!-- Algumas tags sao como etiquetas: <header> indica o cabecalho, <main> o conteudo principal e <footer> o rodape. A <div> apenas agrupa. -->
    <!-- &lt; representa o sinal < e &gt; representa o sinal >. -->
    <!-- A tag <code> destaca trechos de codigo. -->
    <header>
        
        <h1> Semantica HTML</h1>
        <p> conteudo do cabecalho do site fica dentro da tag <code>&lt;header&gt;</code></p> 

    </header>
        
    
<!-- A tag <nav> agrupa os links de navegacao do site. -->
        <nav>
            <a href="#">Link 1</a> 
            <a href="#">Link 2</a>
        </nav>

    
   
 <!-- A tag <main> envolve o conteudo principal da pagina. -->
    <main>
        <!-- A tag <section> agrupa conteudos relacionados da pagina. -->
        <section>
            <div>
             <h2>TItulo da minha primeira sessão</h2>
                <p> texto de paragrafo</p>
                   <a href="#">Link</a>
            </div>  

        </section>

        <section>
            <h2>TItulo da minha segunda sessão</h2>
            <p> texto de paragrafo</p>
            <a href="#">Link</a>
        </section>
    </main>

    <!-- A tag <footer> agrupa informacoes finais da pagina, como contato ou direitos autorais. -->
             <footer>
        <!-- <span> agrupa um trecho em linha, mas nao diz o que ele significa. Use so se precisar selecionar esse trecho; se houver uma tag com significado adequado, prefira ela. -->
        <p>Meu contato: <span>exemplo@email.com</span></p>
              </footer>

              <!-- <div> pode agrupar, por exemplo, um titulo, um paragrafo e um link para aplicar estilo neles juntos. -->
            
                <!-- <article> representa um conteudo independente, como uma noticia ou postagem. Pode conter os mesmos elementos de uma <section>, como titulo, texto, link e imagem; escolha <article> quando o conteudo fizer sentido sozinho. -->
                <article>
                    <h3></h3>
                    <p></p>
                    <a href="#"></a>
                </article>

                <figure>
                    <img src="../tags-html/img/paimon.jpg" alt="Paimon">
                    <figcaption>Legenda da imagem</figcaption>
                </figure>
            </body>
</html>
