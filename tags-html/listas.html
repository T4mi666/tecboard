<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!-- <h1> cria o titulo principal da pagina. -->
    <h1>Minha lista ordenada</h1>
    <!-- <ol> cria uma lista numerada; <li> representa cada item. -->
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <h1>Minha lista desordenada</h1>
    <!-- <ul> cria uma lista com marcadores; <li> representa cada item. -->
    <ul>    
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        </ul>
</body>
</html>
