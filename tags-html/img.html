<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem</title>
</head>
<body>
   <!-- <h1> cria o titulo principal da pagina. -->
   <h1>Imagem da Paimon</h1>
     <!-- <img> mostra uma imagem; src indica o arquivo, alt descreve a imagem e width define a largura. -->
     <img src="img/paimon.jpg" alt="Imagem da Paimon" width="400">
</body>
</html>
