<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatações</title>
</head>
<body>
    <h1>Formatações</h1>
    <ul>
        <!-- <b> deixa o texto em negrito, sem indicar importancia. -->
        <li><b>Negrito</b></li>
        <!-- <strong> destaca um texto importante, geralmente em negrito. -->
        <li><strong>Negrito semantico</strong></li>
        <!-- <i> deixa o texto em italico, sem dar enfase especial. -->
        <li><i>Italico</i></li>
        <!-- <em> da enfase ao texto, geralmente deixando-o em italico. -->
        <li><em>Italico semantico</em></li>
        <!-- <sub> mostra o texto menor e abaixo da linha. -->
        <li>Subscrito: H<sub>2</sub>O</li>
        <!-- <sup> mostra o texto menor e acima da linha. -->
        <li>Sobrescrito: 10<sup>2</sup></li>
</ul>
</body>
</html>
